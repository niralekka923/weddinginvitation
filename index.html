<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>परिणयोत्सव</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Rozha+One&family=Yantra+Manav:wght@300;500&family=Great+Vibes&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* Watermark CSS */
        .watermark-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(4px); }
        .watermark-text { font-size: 3.5rem; color: rgba(211, 47, 47, 0.4); font-family: sans-serif; font-weight: bold; text-transform: uppercase; transform: rotate(-30deg); white-space: nowrap; animation: slideWatermark 3s ease-in-out infinite alternate; margin: -30px 0; }
        @keyframes slideWatermark { 0% { transform: rotate(-30deg) translateX(-50px); } 100% { transform: rotate(-30deg) translateX(50px); } }
        
        /* Quote Animation CSS */
        .religious-animation-text { transition: opacity 0.8s ease-in-out; opacity: 1; }
        .fade-out { opacity: 0; }
    </style>
</head>

<body>
    
    <!--------
    <div id="watermarkOverlay" class="watermark-overlay">
        <div class="watermark-text">DEMO VERSION - UNPAID</div>
        <div class="watermark-text">DEMO VERSION - UNPAID</div>
        <div class="watermark-text">DEMO VERSION - UNPAID</div>
    </div>
    --------->
    

    <div class="main-wrapper">
        <section class="hero">
            <div class="glow-orb orb-1"></div><div class="glow-orb orb-2"></div>

            <div class="hero-content">
                <div class="religious-icon" data-aos="zoom-in"></div>
                <div class="quote-text religious-animation-text" data-aos="fade-up"></div>
                <div class="couple-name couple-english-name" data-aos="zoom-in" data-aos-delay="200"></div>
                <h2 class="hindi-title wedding-front-text" data-aos="fade-up" data-aos-delay="400"></h2>
                <i class="fa-solid fa-chevron-down" style="margin-top: 40px; font-size: 1.5rem; animation: floatIcon 2s infinite; color: var(--gold);"></i>
            </div>
        </section>

        <div class="content-shape" data-aos="fade-up">
            <div class="couple-card">
                <div class="groom-info" data-aos="fade-right">
                    <img class="profile-img g-image" src="">
                    <h2 class="hindi-title g-name"></h2>
                    <p class="g-parents"></p>
                    <p class="g-address"></p>
                </div>
                <div class="vs-circle" data-aos="zoom-in">संग</div>
                <div class="bride-info" data-aos="fade-left">
                    <img class="profile-img b-image" src="">
                    <h2 class="hindi-title b-name"></h2>
                    <p class="b-parents"></p>
                    <p class="b-address"></p>
                </div>
            </div>
            <p class="quote-text wedding-congrats-text" style="font-size: 1.2rem; margin-top: 40px; border-top: 1px dashed var(--gold); padding-top: 20px;"></p>
        </div>

        <div class="content-shape">
            <h2 class="hindi-title" style="margin-bottom: 20px;"><i class="fa-solid fa-calendar-heart" style="color:var(--gold)"></i> वैवाहिक कार्यक्रम</h2>
            <div class="function-container">
                </div>
        </div>

        <div class="content-shape relatives-container" style="text-align: left;">
            </div>

        <div class="countdown-container" data-aos="flip-up">
            <h2 class="hindi-title wedding-countdown-text" style="color: white; font-size: 2rem; margin-bottom: 10px;"></h2>
            <p class="wedding-date-text" style="color: #e0e0e0; font-size: 1.1rem;"></p>
            <div class="timer" id="timer">
                <div class="time-unit"><span id="days">00</span><label>दिन</label></div>
                <div class="time-unit"><span id="hours">00</span><label>घंटे</label></div>
                <div class="time-unit"><span id="minutes">00</span><label>मिनट</label></div>
                <div class="time-unit"><span id="seconds">00</span><label>सेकंड</label></div>
            </div>
        </div>
        
        <footer class="ending-section">
            <div data-aos="zoom-in">
                <h2 style="color: var(--gold); font-size: 3rem; margin-bottom: 10px; font-family: 'Great Vibes', cursive;">धन्यवाद!</h2>
                <p class="quote-text wedding-request-text" style="color: #eee; font-size: 1.2rem;"></p>
                <div style="margin-top: 40px; border-top: 1px solid rgba(255,215,0,0.3); padding-top: 30px;">
                    <p style="font-size: 1.2rem; margin-bottom: 5px; color: var(--gold);"><b>विनीत</b></p>
                    <p class="caller-name" style="font-size: 1.3rem;"></p>
                </div>
            </div>
        </footer>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="scripts/script.js"></script>
</body>
</html>
