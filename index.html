<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>परिणयोत्सव</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Rozha+One&family=Yantra+Manav:wght@300;500&family=Great+Vibes&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    
    <div id="watermarkOverlay" class="watermark-overlay">
        <div class="watermark-text">DEMO VERSION - UNPAID</div>
        <div class="watermark-text">DEMO VERSION - UNPAID</div>
        <div class="watermark-text">DEMO VERSION - UNPAID</div>
    </div>

    <div class="main-wrapper">
        <section class="hero">
            <div class="glow-orb orb-1"></div>
            <div class="glow-orb orb-2"></div>

            <div class="hero-content">
                <div class="religious-icon" data-aos="zoom-in"></div>
                <div class="quote-text religious-animation-text" data-aos="fade-up"></div>
                <div class="couple-name couple-english-name" data-aos="zoom-in" data-aos-delay="200"></div>
                <h2 class="hindi-title wedding-front-text" data-aos="fade-up" data-aos-delay="400"></h2>
                <i class="fa-solid fa-chevron-down down-arrow-icon"></i>
            </div>
        </section>

        <div class="content-shape wedding-profile" data-aos="fade-up">
            <div class="couple-card">
                <div class="groom-info" data-aos="fade-right">
                    <img class="profile-img g-image" src="" alt="">
                    <h2 class="hindi-title g-name"></h2>
                    <p class="g-parents"></p>
                    <p class="g-address"></p>
                </div>
                <div class="vs-circle" data-aos="zoom-in">संग</div>
                <div class="bride-info" data-aos="fade-left">
                    <img class="profile-img b-image" src="" alt="">
                    <h2 class="hindi-title b-name"></h2>
                    <p class="b-parents"></p>
                    <p class="b-address"></p>
                </div>
            </div>
            <p class="quote-text wedding-congrats-text"></p>
        </div>
        
        <div class="content-shape wedding-function">
            <h2 class="hindi-title function-main-title">
                <i class="fa-solid fa-calendar-heart icon-gold"></i> वैवाहिक कार्यक्रम
            </h2>
            <div class="function-container"></div>
        </div>

        <div class="content-shape relatives-container"></div>

        <div class="countdown-container" data-aos="flip-up">
            <h2 class="hindi-title wedding-countdown-text countdown-title"></h2>
            <p class="wedding-date-text countdown-date"></p>
            <div class="timer" id="timer">
                <div class="time-unit">
                    <span id="days">00</span><label>दिन</label>
                </div>
                <div class="time-unit">
                    <span id="hours">00</span><label>घंटे</label>
                </div>
                <div class="time-unit">
                    <span id="minutes">00</span><label>मिनट</label>
                </div>
                <div class="time-unit">
                    <span id="seconds">00</span><label>सेकंड</label>
                </div>
            </div>
        </div>
        
        <footer class="ending-section">
            <div data-aos="zoom-in">
                <h2 class="thank-you-title">धन्यवाद!</h2>
                <p class="quote-text wedding-request-text thank-you-request"></p>
                <div class="vineet-section">
                    <p class="vineet-label"><b>विनीत</b></p>
                    <p class="caller-name vineet-names"></p>
                </div>
            </div>
        </footer>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="scripts/script.js"></script>
</body>
</html>
